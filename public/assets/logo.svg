<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <g id="logo-icon" transform="translate(10, 10)">
    <!-- Outer Location Pin Body (Navy #113045) -->
    <path d="M 50,20 C 30,20 15,35 15,55 C 15,80 50,110 50,110 C 50,110 85,80 85,55 C 85,35 70,20 50,20 Z" fill="#113045"/>
    
    <!-- Inner Pin Cutout (White) -->
    <circle cx="50" cy="50" r="20" fill="#FFFFFF"/>
    
    <!-- Top Arc Accent (Maroon #7F0D24) -->
    <path d="M 50,12 C 25,12 8,30 8,55 C 8,62 10,68 13,74 L 22,68 C 20,64 19,60 19,55 C 19,38 33,23 50,23 C 67,23 81,38 81,55 C 81,60 80,64 78,68 L 87,74 C 90,68 92,62 92,55 C 92,30 75,12 50,12 Z" fill="#7F0D24"/>
    
    <!-- Airplane Taking Off (Gold #D99B26) -->
    <g transform="translate(15, 20) rotate(-22)">
      <path d="M 30,35 L 75,25 L 90,20 L 78,35 L 85,38 L 82,44 L 70,40 L 50,55 L 42,52 L 52,42 L 32,38 Z" fill="#D99B26"/>
    </g>
  </g>
  
  <g id="logo-text" transform="translate(125, 20)">
    <!-- 'eminent' in Maroon #7F0D24 -->
    <text x="0" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="#7F0D24" letter-spacing="-1">eminent</text>
    
    <!-- 'INTERNATIONAL' in Navy #113045 -->
    <text x="0" y="82" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#113045" letter-spacing="2">INTERNATIONAL</text>
    
    <!-- Tagline -->
    <text x="2" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#C58A2B" letter-spacing="0.5">Your Trusted Workforce Partner</text>
  </g>
</svg>
